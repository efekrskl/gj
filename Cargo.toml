[package]
name = "gj"
version = "0.3.0"
edition = "2024"

[dependencies]
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.100"
rusqlite = { version = "0.38.0", features = ["bundled"] }
rusqlite_migration = "2.4.1"
log = "0.4.29"
env_logger = "0.11.8"
clap = { version = "4.5.56", features = ["derive"] }
edit = "0.1.5"
chrono = "0.4.43"
ollama-rs = "0.3.3"
tokio = { version = "1.49.0", features = ["full"] }
ratatui = { version = "0.30.0", features = ["widget-calendar"] }
time = { version = "0.3.46", features = ["parsing", "formatting", "macros"] }
time-macros = { version = "0.2.0-alpha.1" }
reqwest = { version = "0.13.1", features = ["json"] }
blake3 = "1.8.3"
serde_json = "1.0.149"
